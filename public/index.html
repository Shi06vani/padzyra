<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff5f8">
  <title>Padzyra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="lock" hidden>
    <section class="login">
      <img src="/logo.png" alt="">
      <h1>Padzyra</h1>
      <p class="hello">Enter your PIN</p>
      <form id="lock-form">
        <label>PIN<input name="pin" inputmode="numeric" maxlength="4" autocomplete="off" required></label>
        <button type="submit">Open</button>
        <p id="lock-error" class="error"></p>
      </form>
    </section>
  </div>
  <main id="app"></main>
  <nav id="tab" class="tab" hidden></nav>
  <script src="/app.js"></script>
</body>
</html>
